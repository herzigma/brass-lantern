[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brass-lantern"
version = "0.2.0"
description = "LLM benchmark harness: connects any model to a Grue server so it can play text adventures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brass-lantern = "brass_lantern.__main__:main"

[tool.setuptools.packages.find]
include = ["brass_lantern*"]

[tool.setuptools.package-data]
brass_lantern = ["prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
